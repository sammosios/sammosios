name: snake

on:
  schedule:
    - cron: "0 4 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colours from sammosios.com (tailwind.config.js)
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8eff71&color_dots=#1a1919,#0b5800,#0d6100,#2be800,#8eff71&color_background=#0e0e0e
            dist/snake-light.svg?color_snake=#106f00&color_dots=#ebedf0,#c6f7b8,#8eff71,#2be800,#106f00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
